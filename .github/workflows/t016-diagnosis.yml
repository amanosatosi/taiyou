name: T016 exact-case diagnosis
on:
  pull_request:
    paths: ['crates/**', 'experiments/t016/**', '.github/workflows/t016-diagnosis.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t016-diagnosis-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  reproduce:
    name: T016 five frozen cases (supplemental)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TAIYOU_FOCUSED_RENDERER: '1'
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize exact accepted PR base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ]; then
            git fetch --no-tags https://github.com/amanosatosi/taiyou.git refs/heads/main
            BASE=$(git rev-parse FETCH_HEAD)
          fi
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          mkdir "$RUNNER_TEMP/t016-accepted"
          git archive "$BASE" validation docs/references.lock.json | tar -x -C "$RUNNER_TEMP/t016-accepted"
          echo "TAIYOU_ACCEPTED=$RUNNER_TEMP/t016-accepted" >> "$GITHUB_ENV"
          echo "ACCEPTED_BASELINE=$BASE" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/taiyou-libass-tests
          key: candidate-corpus-linux-a5073319af8117271d8ac13ef5c088197ff2d59b-v1
      - run: python "$TAIYOU_ACCEPTED/validation/acquire.py"
      - run: |
          python "$TAIYOU_ACCEPTED/validation/inventory.py" verify --corpus "$TAIYOU_CORPUS" --manifest "$TAIYOU_ACCEPTED/validation/inventory.json"
          chmod -R a-w "$TAIYOU_CORPUS"
      - run: |
          python -m pip install --force-reinstall --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: target
          key: t016-diagnosis-${{ hashFiles('Cargo.lock', 'build-support/sources.lock.json') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: t015-cargo-linux-${{ hashFiles('Cargo.lock', 'build-support/sources.lock.json') }}-
      - run: python build-support/acquire.py
      - run: python build-support/build-native.py
      - name: Existing comparator, exact five frozen inputs
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
        run: python experiments/t016/reproduce.py
      - name: Verify immutable corpus after diagnosis
        if: always()
        run: python "$TAIYOU_ACCEPTED/validation/inventory.py" verify --corpus "$TAIYOU_CORPUS" --manifest "$TAIYOU_ACCEPTED/validation/inventory.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: T016-five-frozen-cases-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/t016-limit-reproduction/
          if-no-files-found: warn
          retention-days: 30
