name: T018 focused metric-expectation review
on:
  push:
    branches: [task/T018-ass-blur]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metric-expectations:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAIYOU_FOCUSED_RENDERER: '1'
      CANDIDATE_SHA: ${{ github.sha }}
      RUSTUP_TOOLCHAIN: 1.99.1


    steps:
      - run: |
          echo "TAIYOU_REVIEW_OUTPUT=$RUNNER_TEMP/t018-metric-review" >> "$GITHUB_ENV"
          echo "TAIYOU_RENDER_SAMPLE_DIR=$RUNNER_TEMP/t018-metric-review" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/metric-format.patch"
          python build-support/acquire.py
          python build-support/build-native.py
      - env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
        run: cargo test --locked -p taiyou-render --features native --lib positive_cell_stroke_budget_evidence -- --nocapture
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/taiyou-libass-tests
          key: candidate-corpus-linux-a5073319af8117271d8ac13ef5c088197ff2d59b-v1
      - run: python validation/acquire.py
      - env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
        run: |
          cargo test --locked -p taiyou-cli --features native --test efont_metric_review -- --nocapture
          python experiments/t017/metric_review.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: T018-metric-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/t018-metric-review/
            ${{ runner.temp }}/metric-format.patch
