name: Corpus inventory candidate
on:
  pull_request:
    paths: ['validation/**', 'xtask/**', '.github/workflows/inventory.yml', 'docs/references.lock.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/taiyou-libass-tests
          key: candidate-corpus-linux-a5073319af8117271d8ac13ef5c088197ff2d59b-v1
      - name: Acquire exact corpus on runner only
        run: python validation/acquire.py
      - name: Install bootstrap Rust on runner only
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
      - name: Generate proposal or verify frozen inventory
        env:
          RUSTUP_TOOLCHAIN: 1.85.1
        run: |
          if [ ! -e validation/inventory.json ]; then
            python validation/inventory.py generate --corpus "$TAIYOU_CORPUS" --manifest "$RUNNER_TEMP/inventory.proposed.json"
            cargo run --offline -p xtask -- inventory verify --corpus "$TAIYOU_CORPUS" --manifest "$RUNNER_TEMP/inventory.proposed.json"
          else
            cargo run --offline -p xtask -- inventory verify --corpus "$TAIYOU_CORPUS" --manifest validation/inventory.json
          fi
          cargo run --offline -p xtask -- policy self-test
