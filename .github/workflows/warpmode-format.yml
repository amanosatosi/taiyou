name: Warpmode formatting evidence
on:
  pull_request:
    paths: ['crates/**', '.github/workflows/warpmode-format.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - run: |
          cargo +1.99.1 fmt --all
          git diff --binary > "$RUNNER_TEMP/warpmode-format.patch"
          test ! -s "$RUNNER_TEMP/warpmode-format.patch"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: warpmode-format-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/warpmode-format.patch
          retention-days: 7
