name: R001 research
on:
  pull_request:
    paths: ['docs/research/R001-legacy.md', 'validation/legacy-rules.json', 'validation/proposals/R001/**', '.github/workflows/r001-research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    name: R001 research evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact candidate
        run: git rev-parse HEAD
      - name: Check proposal provenance and document consistency
        run: python validation/proposals/R001/check.py
      - name: Reject invalid source, capture and approval evidence
        run: python validation/proposals/R001/check.py --self-test
