name: T018 identical-path source masks
on:
  push:
    branches: [task/T018-mask-checks]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAIYOU_FOCUSED_RENDERER: '1'
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/mask-format.patch"
          cargo test --locked -p taiyou-types -p taiyou-render
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
          python build-support/acquire.py
          python build-support/build-native.py
      - env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
          TAIYOU_TEST_FONT: ${{ runner.temp }}/taiyou-native-sources/font.otf
          TAIYOU_TEST_COLLECTION: ${{ runner.temp }}/taiyou-native-sources/collection.otc
          TAIYOU_SHAPING_REFERENCES: ${{ runner.temp }}/taiyou-shaping-reference.tsv
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p taiyou-render --features native --test source_mask -- --nocapture
          cargo clippy --locked --workspace --all-targets --features taiyou-cli/native -- -D warnings
          cargo test --locked -p taiyou-cli --features native --test blur --test ass_coverage_batch --test layout_vertical --test renderer_effect_regressions --test ass_compatibility --test transforms --test drawings --test source_mask_budget
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        if: ${{ !cancelled() }}
        with:
          path: ${{ runner.temp }}/taiyou-libass-tests
          key: candidate-corpus-linux-a5073319af8117271d8ac13ef5c088197ff2d59b-v1
      - if: ${{ !cancelled() }}
        run: python validation/acquire.py
      - env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
          TAIYOU_BE_AUDIT_CORPUS: ${{ runner.temp }}/taiyou-libass-tests
          TAIYOU_BE_AUDIT_OUTPUT: ${{ runner.temp }}/source-masks
          GH_TOKEN: ${{ github.token }}
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p taiyou-cli --features native --test be_audit -- --nocapture
          cargo test --locked -p taiyou-cli --features native --test gaussian_source -- --nocapture
          python experiments/t018-be/source-paths.py
          cargo test --locked -p taiyou-render --features native --test source_mask supplied_gdi -- --nocapture
      - env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
        if: ${{ !cancelled() }}
        run: |
          cargo build --locked -p xtask -p taiyou-cli --features taiyou-cli/native
          cargo run --locked -p xtask -- compare --suite focused --profile core-v1 --case regression/blurs/be-0500.png --case regression/blurs/be-1500.png --case regression/blurs/be-2500.png --case regression/blurs/be-3500.png --case regression/blurs/blur+t-1000.png --case regression/blurs/blur+t-1100.png --case regression/blurs/blur+t-1200.png --case regression/blurs/blur+t-1300.png --case regression/blurs/blur+t-1400.png --case regression/blurs/blur+t-1500.png --case regression/blurs/blur+t-1600.png --case regression/blurs/blur+t-1700.png --case regression/blurs/blur+t-1800.png --case regression/blurs/blur+t-1900.png --case regression/blurs-anamorphic/blur-0000.png
      - if: ${{ !cancelled() }}
        env:
          TAIYOU_BE_AUDIT_CORPUS: ${{ runner.temp }}/taiyou-libass-tests
          TAIYOU_BE_AUDIT_OUTPUT: ${{ runner.temp }}/source-masks
        run: python experiments/t018-be/gaussian-units.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-mask-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mask-format.patch
            ${{ runner.temp }}/taiyou-comparison/
            ${{ runner.temp }}/source-masks/
            ${{ runner.temp }}/taiyou-render-sample/
