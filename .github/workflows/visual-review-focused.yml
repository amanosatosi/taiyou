name: Visual review focused development
on:
  push:
    branches: [task/T015-visual-review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual-review-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exporter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python validation/test_visual_review.py
      - run: python validation/test_compare.py
      - run: python validation/test_oversampling.py
  focused:
    needs: exporter
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TAIYOU_FOCUSED_RENDERER: '1'
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize merged integration inventory and policy
        run: |
          base=2d815d57ea9fa8940db60e8d4bb827eb2aadd0c4
          mkdir "$RUNNER_TEMP/accepted"
          git archive "$base" validation docs/references.lock.json | tar -x -C "$RUNNER_TEMP/accepted"
          echo "TAIYOU_ACCEPTED=$RUNNER_TEMP/accepted" >> "$GITHUB_ENV"
          echo "ACCEPTED_BASELINE=$base" >> "$GITHUB_ENV"
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: python build-support/acquire.py
      - run: python build-support/build-native.py
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/taiyou-libass-tests
          key: candidate-corpus-linux-a5073319af8117271d8ac13ef5c088197ff2d59b-v1
      - run: python validation/acquire.py
      - run: chmod -R a-w "$TAIYOU_CORPUS"
      - name: Build existing renderer and exercise applicable stage tests
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
        run: |
          cargo build --locked -p xtask -p taiyou-cli --features taiyou-cli/native
          cargo test --locked -p taiyou-cli --features native --test comparison_adapter
          cargo test --locked -p taiyou-cli --features native --test visual_compatibility --test drawings --test ass_coverage_batch
      - name: Small representative selection only (mismatches remain failures)
        id: smoke
        run: |
          cargo run --locked -p xtask -- compare --suite focused --profile core-v1 --case regression/draw-images/drawImg-104396.png --case regression/v4++/kt-01500.png --case regression/implicit-pos/shift-dir-1500.png --case regression/zero-area/zero-area-2000.png --case regression/zero-area/zero-area-8000.png --visual-review "$RUNNER_TEMP/visual-review"
      - name: Verify review triplets and render independent reduced witnesses
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        run: |
          python validation/visual_review.py --verify "$RUNNER_TEMP/visual-review"
          python scripts/render-review-witnesses.py --review "$RUNNER_TEMP/visual-review" --corpus "$TAIYOU_CORPUS"
      - name: Reverify all frozen assets
        if: always()
        run: python "$TAIYOU_ACCEPTED/validation/inventory.py" verify --corpus "$TAIYOU_CORPUS" --manifest "$TAIYOU_ACCEPTED/validation/inventory.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-review-focused-${{ github.sha }}
          path: ${{ runner.temp }}/visual-review/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-review-focused-raw-${{ github.sha }}
          path: ${{ runner.temp }}/taiyou-comparison/
          retention-days: 7
