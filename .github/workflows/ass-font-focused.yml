name: ASS font compatibility focused checks
on:
  push:
    branches: [task/T008-ass-font-compatibility, task/T008-font-collection-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - run: |
          cargo +1.99.1 fmt --all
          git diff --binary > "$RUNNER_TEMP/ass-font-format.patch"
          cargo +1.99.1 test --locked -p taiyou-ass -p taiyou-types
          python validation/test_compare.py
          # The existing Fast gate enforces formatting. This supplemental job
          # also publishes the runner-generated patch for local application.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ass-font-format-${{ github.sha }}
          path: ${{ runner.temp }}/ass-font-format.patch
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/taiyou-libass-tests
          key: candidate-corpus-linux-a5073319af8117271d8ac13ef5c088197ff2d59b-v1
      - run: python validation/acquire.py
      - run: python validation/inventory.py verify --corpus "$TAIYOU_CORPUS" --manifest validation/inventory.json
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
      - run: python build-support/inspect-ass-fonts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ass-font-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/ass-font-metadata.json
  native:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TAIYOU_FOCUSED_RENDERER: '1'
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: python build-support/acquire.py
      - run: python build-support/build-native.py
      - name: Focused alias and embedded renderer tests
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
          TAIYOU_TEST_FONT: ${{ runner.temp }}/taiyou-native-sources/font.otf
          TAIYOU_TEST_BOLD: ${{ runner.temp }}/taiyou-native-sources/bold.otf
          TAIYOU_TEST_COLLECTION: ${{ runner.temp }}/taiyou-native-sources/collection.otc
        run: |
          cargo +1.99.1 test --locked -p taiyou-font --features native --test catalog
          cargo +1.99.1 test --locked -p taiyou-cli --features native --test embedded_fonts
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/taiyou-libass-tests
          key: candidate-corpus-linux-a5073319af8117271d8ac13ef5c088197ff2d59b-v1
      - run: python validation/acquire.py
      - name: Actual three font cases through the unchanged pixel metrics
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
        run: |
          cargo +1.99.1 build --locked -p xtask -p taiyou-cli --features taiyou-cli/native
          cargo +1.99.1 run --locked -p xtask -- compare --suite focused --profile core-v1 --case regression/font_nonunicode/shiftjis-1000.png --case regression/faux-italics/cff-0000.png --case regression/embedded-font/efont-1000.png
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ass-font-focused-${{ github.sha }}
          path: ${{ runner.temp }}/taiyou-comparison/
