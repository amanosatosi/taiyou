name: Native dependency recipes
on:
  pull_request:
    paths: ['build-support/**', '.github/workflows/native-deps.yml', 'rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'docs/DEPENDENCIES.md', 'THIRD_PARTY_NOTICES.md']
  push:
    branches: ['task/T002-native-recipes']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-deps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Discover immutable source archive hashes (not build acceptance)
        run: python3 build-support/acquire.py --discover
