name: Native dependency recipes
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-deps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  select:
    name: Select platform checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.select.outputs.native }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative selector
        run: python scripts/select-platforms.py --self-test
      - name: Select platform checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'native=true' >> "$GITHUB_OUTPUT"
          else
            python scripts/select-platforms.py "$BASE_SHA" "$HEAD_SHA"
          fi
  native:
    needs: select
    if: needs.select.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install exact hashed build tools on runner only
        run: |
          python -m pip install --force-reinstall --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
      - name: Install pinned Rust on runner only
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Verify pinned native sources and font
        run: python build-support/acquire.py
      - name: Check formatting before native compilation
        run: |
          cargo +1.99.1 fmt --all -- --check
          cargo +1.99.1 fmt --manifest-path build-support/dependency-smoke/Cargo.toml -- --check
      - name: Cold native build, locked workspace and binding glyph-count smoke
        run: python build-support/build-native.py
  gate:
    name: Platform gate
    needs: [select, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected platform
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          RUN_NATIVE: ${{ needs.select.outputs.native }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          [[ "$SELECT_RESULT" == success ]] || exit 1
          if [[ "$RUN_NATIVE" == true ]]; then
            [[ "$NATIVE_RESULT" == success ]] || exit 1
          elif [[ "$RUN_NATIVE" == false ]]; then
            [[ "$NATIVE_RESULT" == skipped ]] || exit 1
          else
            exit 1
          fi
