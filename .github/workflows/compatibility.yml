name: T015 external comparison
on:
  pull_request:
    paths:
      - 'xtask/**'
      - 'validation/**'
      - '.github/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'build-support/**'
      - 'tests/**'
      - 'scripts/**'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'AGENTS.md'
      - 'docs/CONTRACTS.md'
      - 'docs/COMPATIBILITY.md'
      - 'docs/CACHING.md'
      - 'docs/TESTING.md'
      - 'docs/DEVELOPMENT.md'
      - 'docs/references.lock.json'
      - 'docs/decisions/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  accepted_baseline:
    name: Resolve accepted baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # Resolve once from the canonical repository, before executing candidate
      # code. A manual candidate branch is never its own acceptance authority.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: amanosatosi/taiyou
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'refs/heads/main' }}
          persist-credentials: false
      - name: Record and validate the accepted baseline
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          baseline=$(git rev-parse HEAD)
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          case "$EVENT_NAME" in
            pull_request) test "$baseline" = "$PR_BASE" ;;
            workflow_dispatch) test "$baseline" = "$(git rev-parse refs/remotes/origin/main)" ;;
            *) echo 'Unsupported baseline authority' >&2; exit 1 ;;
          esac
          echo "ACCEPTED_BASELINE=$baseline"
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"
  self-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python validation/test_compare.py
      - run: python validation/policy.py self-test
      - run: python scripts/check-unsafe.py
  compare:
    needs: [self-tests, accepted_baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAIYOU_FOCUSED_RENDERER: '1'
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize accepted baseline without candidate replacements
        env:
          BASE: ${{ needs.accepted_baseline.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/amanosatosi/taiyou.git "$BASE"
          test "$(git rev-parse "$BASE^{commit}")" = "$BASE"
          accepted="$RUNNER_TEMP/accepted"
          mkdir "$accepted"
          git archive "$BASE" validation docs/references.lock.json | tar -x -C "$accepted"
          echo "TAIYOU_ACCEPTED=$accepted" >> "$GITHUB_ENV"
          echo "ACCEPTED_BASELINE=$BASE" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/taiyou-libass-tests
          key: candidate-corpus-linux-a5073319af8117271d8ac13ef5c088197ff2d59b-v1
      - run: python "$TAIYOU_ACCEPTED/validation/acquire.py"
      - name: Verify corpus and remove write permissions
        run: |
          python "$TAIYOU_ACCEPTED/validation/inventory.py" verify --corpus "$TAIYOU_CORPUS" --manifest "$TAIYOU_ACCEPTED/validation/inventory.json"
          chmod -R a-w "$TAIYOU_CORPUS"
      - run: |
          python -m pip install --force-reinstall --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: target
          key: t015-cargo-linux-${{ hashFiles('Cargo.lock', 'build-support/sources.lock.json') }}-${{ github.sha }}
          restore-keys: t015-cargo-linux-${{ hashFiles('Cargo.lock', 'build-support/sources.lock.json') }}-
      - run: python build-support/acquire.py
      - name: Existing pinned native recipe and T014 regressions
        run: python build-support/build-native.py
      - name: Build comparator launcher and real renderer
        id: comparison_build
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/taiyou-native-install/lib/pkgconfig"
          export PKG_CONFIG_ALL_STATIC=1 LIBZ_SYS_STATIC=1
          cargo build --locked -p xtask -p taiyou-cli --features taiyou-cli/native
      - name: Existing comparison adapter and parser smoke checks
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/taiyou-native-install/lib/pkgconfig"
          export PKG_CONFIG_ALL_STATIC=1 LIBZ_SYS_STATIC=1
          cargo test --locked -p taiyou-cli --features native --test comparison_adapter
          cargo run --locked -p xtask -- compare-crash-probe "$TAIYOU_CORPUS/crash/generic.ass"
      - name: Supplemental focused smoke (never replaces full coverage)
        run: |
          set -eu
          case_id=$(python -c 'import json,os; d=json.load(open(os.environ["TAIYOU_ACCEPTED"]+"/validation/inventory.json")); print(next(c["id"] for c in d["cases"] if c["kind"]=="regression" and c["scale"]=="1"))')
          cargo run --locked -p xtask -- compare --suite focused --profile core-v1 --case "$case_id" --case crash/generic.ass --output "$RUNNER_TEMP/taiyou-focused-comparison"
      - name: Full pinned external comparison (all relevant PRs and dispatches)
        id: full_comparison
        # A smoke failure cannot suppress the full run. Build failure/cancellation
        # remains a real failure; neither permits a false comparison pass.
        if: ${{ !cancelled() && steps.comparison_build.outcome == 'success' }}
        run: cargo run --locked -p xtask -- compare --suite full --profile core-v1
      - name: Verify full-corpus accounting and evidence invariants
        if: always()
        run: python validation/test_compare.py --report "$RUNNER_TEMP/taiyou-comparison/report.json"
      - name: Reverify immutable corpus even after failure
        if: always()
        run: |
          python "$TAIYOU_ACCEPTED/validation/inventory.py" verify --corpus "$TAIYOU_CORPUS" --manifest "$TAIYOU_ACCEPTED/validation/inventory.json"
          git diff --exit-code -- validation/inventory.json validation/policy.json docs/references.lock.json Cargo.lock
      - name: Archive actual candidate comparison and bounded difference images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: T015-comparison-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/taiyou-comparison/
          if-no-files-found: warn
          retention-days: 7
      - name: Archive supplemental focused smoke separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: T015-focused-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/taiyou-focused-comparison/
          if-no-files-found: warn
          retention-days: 7
  native-oracle:
    needs: [self-tests, accepted_baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize accepted oracle pins and corpus inventory
        env:
          BASE: ${{ needs.accepted_baseline.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/amanosatosi/taiyou.git "$BASE"
          test "$(git rev-parse "$BASE^{commit}")" = "$BASE"
          mkdir "$RUNNER_TEMP/accepted"
          git archive "$BASE" validation docs/references.lock.json | tar -x -C "$RUNNER_TEMP/accepted"
          echo "TAIYOU_ACCEPTED=$RUNNER_TEMP/accepted" >> "$GITHUB_ENV"
          echo "ACCEPTED_BASELINE=$BASE" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/taiyou-libass-tests
          key: candidate-corpus-linux-a5073319af8117271d8ac13ef5c088197ff2d59b-v1
      - run: python "$TAIYOU_ACCEPTED/validation/acquire.py"
      - run: |
          python "$TAIYOU_ACCEPTED/validation/inventory.py" verify --corpus "$TAIYOU_CORPUS" --manifest "$TAIYOU_ACCEPTED/validation/inventory.json"
          chmod -R a-w "$TAIYOU_CORPUS"
      - name: Provision and record native oracle build environment (no system libass)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool pkg-config nasm libfreetype-dev libharfbuzz-dev libfribidi-dev libpng-dev
      - run: python validation/libass_adapter.py --output "$RUNNER_TEMP/taiyou-native-oracle"
      - name: Archive original harness logs and environment provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: T015-native-oracle-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/taiyou-native-oracle/
          if-no-files-found: warn
          retention-days: 7
