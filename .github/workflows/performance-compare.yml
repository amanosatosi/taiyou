name: Frozen Taiyou versus libass performance
on:
  push:
    branches: [perf/cache-multithread]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance-comparison-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[libass-perf]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      TAIYOU_FOCUSED_RENDERER: '1'
      FROZEN_CHECKPOINT: 2b80565e4998e22032d6bb4a446013886df7c62c
      LIBASS_PIN: f61db567e6593df3470e91594bcd4ad2d0473aff
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify frozen implementation and format only the new adapter
        run: |
          git fetch --no-tags origin "$FROZEN_CHECKPOINT"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all
          mkdir -p "$RUNNER_TEMP/performance-comparison"
          git diff --binary > "$RUNNER_TEMP/performance-comparison/format.patch"
          git diff --exit-code "$FROZEN_CHECKPOINT" -- crates/taiyou-render crates/taiyou-font crates/taiyou-types crates/taiyou-ass crates/taiyou-capi crates/taiyou-cli/src crates/taiyou-cli/Cargo.toml Cargo.lock Cargo.toml build-support validation tests docs/references.lock.json
          git rev-parse HEAD > "$RUNNER_TEMP/performance-comparison/commit.txt"
          git rev-parse HEAD:crates/taiyou-render > "$RUNNER_TEMP/performance-comparison/renderer-tree.txt"
          rustc -Vv > "$RUNNER_TEMP/performance-comparison/rustc.txt"
          lscpu > "$RUNNER_TEMP/performance-comparison/cpu.txt"
          uname -a > "$RUNNER_TEMP/performance-comparison/platform.txt"
          env | sort | grep -E '^(ImageOS|ImageVersion|RUNNER_OS|RUNNER_ARCH)=' >> "$RUNNER_TEMP/performance-comparison/platform.txt"
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
      - run: python build-support/acquire.py
      - run: python build-support/build-native.py
      - name: Build frozen Taiyou comparison caller
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
        run: cargo build --release --locked -p taiyou-cli --features native --example performance_compare
      - name: Normal pinned libass build with the same FreeType and HarfBuzz
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config nasm libfribidi-dev
          python -c "import json,os; p=next(r for r in json.load(open('docs/references.lock.json'))['references'] if r['id']=='libass'); assert p['commit']==os.environ['LIBASS_PIN']"
          git init "$RUNNER_TEMP/performance-libass-source"
          git -C "$RUNNER_TEMP/performance-libass-source" fetch --depth=1 https://github.com/libass/libass "$LIBASS_PIN"
          git -C "$RUNNER_TEMP/performance-libass-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/performance-libass-source" rev-parse HEAD)" = "$LIBASS_PIN"
          git -C "$RUNNER_TEMP/performance-libass-source" fsck --full
          cd "$RUNNER_TEMP/performance-libass-source"
          sh autogen.sh
          CFLAGS='-O3 -DNDEBUG' ./configure --prefix="$RUNNER_TEMP/performance-libass-install" --libdir="$RUNNER_TEMP/performance-libass-install/lib" --disable-shared --enable-static --disable-fontconfig --disable-require-system-font-provider
          make -j2
          make install
          git diff --exit-code -- libass/
      - name: Build the full-RGBA libass client and record exact provenance
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/performance-libass-install/lib/pkgconfig:${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
        run: |
          test "$(pkg-config --variable=prefix libass)" = "$RUNNER_TEMP/performance-libass-install"
          cc -O3 -std=c11 -Wall -Wextra -Werror experiments/performance/libass-performance.c $(pkg-config --static --cflags --libs libass) -lstdc++ -o "$RUNNER_TEMP/libass-performance"
          pkg-config --modversion libass freetype2 harfbuzz fribidi > "$RUNNER_TEMP/performance-comparison/library-versions.txt"
          pkg-config --static --cflags --libs libass > "$RUNNER_TEMP/performance-comparison/libass-link-flags.txt"
          cc --version > "$RUNNER_TEMP/performance-comparison/cc.txt"
          dpkg-query -W libfribidi-dev libfribidi0 nasm > "$RUNNER_TEMP/performance-comparison/packages.txt"
          cp "$RUNNER_TEMP/performance-libass-source/RELEASEVERSION" "$RUNNER_TEMP/performance-comparison/libass-release.txt"
          cp "$RUNNER_TEMP/performance-libass-source/config.log" "$RUNNER_TEMP/performance-comparison/libass-config.log"
          cp /usr/share/doc/libfribidi0/copyright "$RUNNER_TEMP/performance-comparison/fribidi-copyright.txt"
          printf '%s\n' "$LIBASS_PIN" > "$RUNNER_TEMP/performance-comparison/libass-commit.txt"
          printf '%s\n' "$FROZEN_CHECKPOINT" > "$RUNNER_TEMP/performance-comparison/frozen-checkpoint.txt"
      - name: Compare identical immutable inputs and fixed timestamp samples
        env:
          TAIYOU_TEST_FONT: ${{ runner.temp }}/taiyou-native-sources/font.otf
          TAIYOU_COMPARE_BINARY: ${{ github.workspace }}/target/release/examples/performance_compare
          LIBASS_COMPARE_BINARY: ${{ runner.temp }}/libass-performance
        run: |
          python experiments/performance/compare-libass.py prepare "$RUNNER_TEMP/performance-comparison"
          python experiments/performance/compare-libass.py run "$RUNNER_TEMP/performance-comparison"
          cat "$RUNNER_TEMP/performance-comparison/table.md"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-comparison-${{ github.sha }}
          path: ${{ runner.temp }}/performance-comparison/
          retention-days: 7
