name: Compatibility repair focused checks
on:
  push:
    branches: [task/T018-compat-repair-focus]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compat-repair-focused-${{ github.ref }}
  cancel-in-progress: true
jobs:
  italic-gdi:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: git config --global core.autocrlf false
      - run: git config --global core.symlinks true
      - run: python validation/acquire.py
      - run: python validation/inventory.py verify --corpus "$env:TAIYOU_CORPUS" --manifest validation/inventory.json
      - shell: pwsh
        if: ${{ !cancelled() }}
        run: ./experiments/compat-repair/italic-gdi.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compatibility-italic-gdi-${{ github.sha }}
          path: ${{ runner.temp }}/italic-gdi.json
          retention-days: 7
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TAIYOU_FOCUSED_RENDERER: '1'
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/compat-repair-format.patch"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: target
          key: compat-repair-${{ hashFiles('Cargo.lock', 'build-support/sources.lock.json') }}-${{ github.sha }}
          restore-keys: compat-repair-${{ hashFiles('Cargo.lock', 'build-support/sources.lock.json') }}-
      - run: python build-support/acquire.py
      - run: python build-support/build-native.py
      - name: Font mapping regression and existing shaping/catalog coverage
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
          TAIYOU_TEST_FONT: ${{ runner.temp }}/taiyou-native-sources/font.otf
          TAIYOU_TEST_BOLD: ${{ runner.temp }}/taiyou-native-sources/bold.otf
          TAIYOU_TEST_COLLECTION: ${{ runner.temp }}/taiyou-native-sources/collection.otc
          TAIYOU_SHAPING_REFERENCES: ${{ runner.temp }}/taiyou-shaping-reference.tsv
        run: |
          cargo test --locked -p taiyou-font --features native --lib --test catalog --test shaping --test authenticated_outline
          cargo test --locked -p taiyou-render --features native --lib
          cargo test --locked -p taiyou-cli --features native --test synthetic_italic --test geometry --test ass_coverage_batch --test collision_review
          python - <<'PY'
          import subprocess
          from pathlib import Path
          path=Path('crates/taiyou-render/src/axis_widen.rs')
          original=path.read_bytes()
          changed=original.replace(b'line(prev, p[3], edges, limits)',b'line(prev, sample(1.0), edges, limits)')
          assert changed != original, 'negative control replacement missing'
          try:
              path.write_bytes(changed)
              result=subprocess.run(['cargo','test','--locked','-p','taiyou-render','--features','native','--lib','closed_quadratic_contours_have_balanced_scanline_winding','--','--nocapture'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              print(result.stdout)
              assert result.returncode != 0 and 'dy=' in result.stdout and 'FAILED' in result.stdout, 'old raster endpoint failed to reproduce the winding defect'
          finally:
              path.write_bytes(original)
          PY
          cargo build --locked -p xtask -p taiyou-cli --features taiyou-cli/native
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/taiyou-libass-tests
          key: candidate-corpus-linux-a5073319af8117271d8ac13ef5c088197ff2d59b-v1
      - run: python validation/acquire.py
      - name: Existing frozen font frames (strict mismatches stay red)
        id: fonts
        run: |
          python validation/inventory.py verify --corpus "$TAIYOU_CORPUS" --manifest validation/inventory.json
          chmod -R a-w "$TAIYOU_CORPUS"
          cargo run --locked -p xtask -- compare --suite focused --profile core-v1 --case regression/font_nonunicode/big5-hkscs-1000.png --case regression/font_nonunicode/shiftjis-1000.png --case regression/font_nonunicode/legacy-arabic-simplified-1000.png --case regression/font_nonunicode/legacy-arabic-traditional-1000.png --case regression/font_nonunicode/symbol-first-char-0x0000-1000.png --case regression/font_nonunicode/symbol-first-char-0xF000-1000.png --case regression/faux-italics/cff-0000.png --case regression/faux-italics/truetype-0000.png --case regression/embedded-font/efont-1000.png --case regression/draw-images/drawImg-104396.png --case regression/token-parsing/trimming-0000.png --case regression/vsf-quirks-var/alpha-clipping-2040.png --case regression/vsf-quirks-var/alpha-clipping-2560.png --case regression/vsf-quirks-var/alpha-clipping-4960.png --case regression/blurs/be-0500.png --case regression/blurs/blur+t-1000.png --case regression/blurs-anamorphic/blur-0000.png --case regression/v4++/kt-01500.png --case regression/karaoke/karaoke-and-runsplits-2040.png --case regression/implicit-pos/shift-dir-0500.png --case regression/implicit-pos/bordercollision-2000.png --case regression/scaling_playres/playresx_sbas-yes-0000.png --case regression/scaled-border-default/ffmpeg-8000.png
      - name: Review output and immutable corpus verification after differences
        if: ${{ !cancelled() && steps.fonts.outcome != 'skipped' }}
        run: |
          python validation/visual_review.py --verify "$RUNNER_TEMP/visual-review"
          python validation/inventory.py verify --corpus "$TAIYOU_CORPUS" --manifest validation/inventory.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ['RUNNER_TEMP'])/'taiyou-comparison/report.json').read_text())
          for row in report['records']:
              print(row['case'], row.get('observed_result'), row.get('raw_sha256'), json.dumps(row.get('metrics')), row.get('diagnostics'))
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-repair-focused-${{ github.sha }}
          path: |
            ${{ runner.temp }}/taiyou-comparison/
            ${{ runner.temp }}/compat-repair-format.patch
          retention-days: 7
  font-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve the narrowly added codec dependency on runner only
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 metadata --format-version 1 > "$RUNNER_TEMP/metadata.json"
          git diff -- Cargo.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-repair-lock-${{ github.sha }}
          path: Cargo.lock
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/taiyou-libass-tests
          key: candidate-corpus-linux-a5073319af8117271d8ac13ef5c088197ff2d59b-v1
      - run: python validation/acquire.py
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
          python validation/inventory.py verify --corpus "$TAIYOU_CORPUS" --manifest validation/inventory.json
          chmod -R a-w "$TAIYOU_CORPUS"
      - name: Inspect actual legacy cmap identities (read-only)
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from fontTools.ttLib import TTFont
          inventory=json.loads(Path('validation/inventory.json').read_text())
          corpus=Path(os.environ['TAIYOU_CORPUS'])
          for case in inventory['cases']:
              if '/font_nonunicode/' not in case['source']: continue
              print('CASE',case['id'])
              for path in case['fonts']:
                  with TTFont(corpus/path) as font:
                      print('FONT',path)
                      for table in font['cmap'].tables:
                          print('CMAP',table.platformID,table.platEncID,table.format,len(table.cmap),'first',next(iter(table.cmap.items()),None))
                          codec={2:'cp932',3:'cp936',4:'cp950',5:'cp949',6:'johab'}.get(table.platEncID) if table.platformID==3 else None
                          if codec:
                              for ch in '文鼎新藝體訐解古天君の隣':
                                  try:
                                      code=int.from_bytes(ch.encode(codec),'big')
                                      glyph=table.cmap.get(code)
                                      print('MAPPING',ch,hex(ord(ch)),codec,hex(code),glyph,font.getGlyphID(glyph) if glyph else None)
                                  except UnicodeEncodeError: pass
          PY
