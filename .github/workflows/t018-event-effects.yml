name: T018 ordinary ASS event effects focused
on:
  push:
    branches: [task/T018-ass-blur]
    paths: ['crates/**', '.github/workflows/t018-event-effects.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t018-event-effects-${{ github.ref }}
  cancel-in-progress: true
jobs:
  effects-and-drawimg:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAIYOU_FOCUSED_RENDERER: '1'
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Batch parser, evaluator, timing and structural placement tests first
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/event-effects-format.patch"
          cargo test --locked -p taiyou-ass --test event_effects --test overrides
          cargo test --locked -p taiyou-cli --test ass_event_effects --test transforms
          cargo test --locked -p taiyou-render --lib placement_analysis_tests
          cargo test --locked -p taiyou-types
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
          python build-support/acquire.py
          python build-support/build-native.py
      - name: Real text/drawing geometry, fade pixels and random seeks
        env:
          TAIYOU_TEST_FONT: ${{ runner.temp }}/taiyou-shaping-fonts/latin.otf
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
        run: |
          cargo test --locked -p taiyou-render --features native --lib measured_effects_scene_matches_independent_f1_anchors_not_pre_f1_anchors
          cargo test --locked -p taiyou-cli --features native --test adaptive_f1_equivalence
          cargo test --locked -p taiyou-cli --features native --test ass_event_effects --test transforms --test drawings --test renderer_slice
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/taiyou-libass-tests
          key: candidate-corpus-linux-a5073319af8117271d8ac13ef5c088197ff2d59b-v1
      - run: python validation/acquire.py
      - name: One frozen drawImg frame, actual strict result
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
        run: |
          cargo build --locked -p xtask -p taiyou-cli --features taiyou-cli/native
          cargo run --locked -p xtask -- compare --suite focused --profile core-v1 --case regression/draw-images/drawImg-104396.png
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: T018-event-effects-${{ github.sha }}
          path: |
            ${{ runner.temp }}/event-effects-format.patch
            ${{ runner.temp }}/taiyou-comparison/
