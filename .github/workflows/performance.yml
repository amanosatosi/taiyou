name: Performance phase measurements
on:
  push:
    branches: [perf/cache-multithread]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    # New optional performance evidence runs at explicit checkpoints. Existing
    # Fast, platform and complete external-comparison workflows remain unchanged.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[perf]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      TAIYOU_FOCUSED_RENDERER: '1'
      TAIYOU_PERF_WORKLOADS: dialogue,thick-borders,large-blur,combined-abuse,transforms,vector
      TAIYOU_PERF_SCENARIOS: cold,same-time,sequence,seek
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Format evidence and safe workspace checks
        run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/performance-format.patch"
          cargo test --locked -p taiyou-render -p taiyou-types
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
      - name: Identify cache compiler
        id: compiler
        run: echo "cc=$(cc -dumpfullversion -dumpversion)-$(cc -dumpmachine)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        id: native-cache
        with:
          # Native recipes relocate extracted trees and perform cold Meson setup.
          # Reusing their directories is invalid; only Cargo artifacts persist.
          path: target
          key: performance-target-v2-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-${{ steps.compiler.outputs.cc }}-${{ hashFiles('Cargo.lock', 'build-support/sources.lock.json', 'build-support/build-native.py') }}-${{ github.sha }}
          restore-keys: performance-target-v2-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-${{ steps.compiler.outputs.cc }}-${{ hashFiles('Cargo.lock', 'build-support/sources.lock.json', 'build-support/build-native.py') }}-
      - run: python build-support/acquire.py
      - run: python build-support/build-native.py
      - name: Save successful candidate build before benchmark-only resource failures
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Existing stages and supplemental exact-cache tests
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
          TAIYOU_TEST_FONT: ${{ runner.temp }}/taiyou-native-sources/font.otf
          TAIYOU_TEST_BOLD: ${{ runner.temp }}/taiyou-native-sources/bold.otf
          TAIYOU_TEST_COLLECTION: ${{ runner.temp }}/taiyou-native-sources/collection.otc
          TAIYOU_SHAPING_REFERENCES: ${{ runner.temp }}/taiyou-shaping-reference.tsv
          TAIYOU_PERF_FAILURES: ${{ runner.temp }}/performance/failures.tsv
        run: |
          cargo test --locked -p taiyou-render --features native
          cargo test --locked -p taiyou-cli --features native --test performance_cache
      - name: Paired uncached and cached span-reuse release measurements
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
          TAIYOU_TEST_FONT: ${{ runner.temp }}/taiyou-native-sources/font.otf
          TAIYOU_PERF_FAILURES: ${{ runner.temp }}/performance/failures.tsv
        run: |
          cargo build --release --locked -p taiyou-cli --features native --example performance
          mkdir -p "$RUNNER_TEMP/performance"
          git rev-parse HEAD > "$RUNNER_TEMP/performance/commit.txt"
          rustc -Vv > "$RUNNER_TEMP/performance/rustc.txt"
          lscpu > "$RUNNER_TEMP/performance/cpu.txt"
          uname -a > "$RUNNER_TEMP/performance/platform.txt"
          env | sort | grep -E '^(ImageOS|ImageVersion|RUNNER_OS|RUNNER_ARCH)=' >> "$RUNNER_TEMP/performance/platform.txt"
          env | sort | grep '^TAIYOU_PERF_' > "$RUNNER_TEMP/performance/selection.txt"
          # The original baseline remains committed. These modes measure the
          # current span-reuse implementation and its cache, not a new baseline.
          set +e
          TAIYOU_PERF_CACHE=off /usr/bin/time -v -o "$RUNNER_TEMP/performance/process-memory-off.txt" target/release/examples/performance > "$RUNNER_TEMP/performance/off.csv"
          off_status=$?
          TAIYOU_PERF_CACHE=on TAIYOU_PERF_FAILURES="$RUNNER_TEMP/performance/failures-on.tsv" /usr/bin/time -v -o "$RUNNER_TEMP/performance/process-memory-on.txt" target/release/examples/performance > "$RUNNER_TEMP/performance/on.csv"
          on_status=$?
          set -e
          cat "$RUNNER_TEMP/performance/off.csv" > "$RUNNER_TEMP/performance/samples.csv"
          tail -n +2 "$RUNNER_TEMP/performance/on.csv" >> "$RUNNER_TEMP/performance/samples.csv"
          test "$off_status" = 0 && test "$on_status" = 0
      - name: Summarize available samples, including after a benchmark failure
        if: ${{ !cancelled() }}
        run: |
          python experiments/performance/summarize.py "$RUNNER_TEMP/performance/samples.csv" "$RUNNER_TEMP/performance/summary.json"
          cat "$RUNNER_TEMP/performance/failures.tsv"
          cat "$RUNNER_TEMP/performance/failures-on.tsv"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/performance/
            ${{ runner.temp }}/performance-format.patch
          retention-days: 7
