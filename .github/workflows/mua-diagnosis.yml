name: MUA direct xy diagnosis (supplemental)
on:
  push:
    branches: [task/T015-visual-compatibility-repair]
    paths:
      - 'experiments/xy-oracle/mua-diagnosis.py'
      - 'crates/taiyou-cli/examples/mua_metrics.rs'
      - 'crates/taiyou-cli/src/render/system_fonts.rs'
      - 'crates/taiyou-font/**'
      - 'crates/taiyou-render/src/geometry.rs'
      - 'crates/taiyou-render/src/layout.rs'
      - 'crates/taiyou-types/src/layout.rs'
      - 'experiments/xy-oracle/near-matches.py'
      - 'experiments/xy-oracle/font-path-probe.py'
      - '.github/workflows/mua-diagnosis.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mua-diagnosis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gdi-link:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python -m pip install --force-reinstall --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
      - run: python experiments/xy-oracle/acquire-mua.py
      - run: git config --global core.symlinks true
      - run: python validation/acquire.py
      - run: python experiments/xy-oracle/font-path-probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: font-path-probe-${{ github.sha }}
          path: ${{ runner.temp }}/font-path-probe.json
          retention-days: 7
      - shell: pwsh
        run: python experiments/xy-oracle/mua-diagnosis.py --gdi-only --output "$env:RUNNER_TEMP/gdi-link"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mua-gdi-link-${{ github.sha }}
          path: ${{ runner.temp }}/gdi-link/
          retention-days: 7
  diagnosis:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      TAIYOU_FOCUSED_RENDERER: '1'
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Formatting evidence
        shell: pwsh
        run: |
          cargo fmt --all
          git diff --binary | Out-File -Encoding utf8 "$env:RUNNER_TEMP/mua-format.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mua-format-${{ github.sha }}
          path: ${{ runner.temp }}/mua-format.patch
          retention-days: 7
      - run: |
          python -m pip install --force-reinstall --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
      - run: git config --global core.symlinks true
      - run: python validation/acquire.py
      - run: python experiments/xy-oracle/acquire-mua.py
      - shell: pwsh
        run: ./experiments/xy-oracle/acquire.ps1
      - run: python build-support/acquire.py
      - run: python build-support/build-native.py
      - name: Compile diagnostic using existing native dependencies
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "$env:RUNNER_TEMP/taiyou-native-install/lib/pkgconfig"
          $env:PKG_CONFIG_ALL_STATIC = '1'
          $env:LIBZ_SYS_STATIC = '1'
          cargo build --locked -p taiyou-cli --features native --example mua_metrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python experiments/xy-oracle/mua-diagnosis.py --output "$env:RUNNER_TEMP/mua-diagnosis"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python experiments/xy-oracle/near-matches.py --output "$env:RUNNER_TEMP/near-matches"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mua-diagnosis-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mua-diagnosis/
            ${{ runner.temp }}/mua-format.patch
            ${{ runner.temp }}/near-matches/
          retention-days: 7
