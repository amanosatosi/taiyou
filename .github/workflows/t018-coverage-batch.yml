name: T018 focused ASS coverage batch
on:
  push:
    branches: [task/T018-feature-checks]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t018-coverage-batch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAIYOU_FOCUSED_RENDERER: '1'
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: |
          cargo fmt --all
          git diff --binary > "$RUNNER_TEMP/batch-format.patch"
          cargo test --locked -p taiyou-ass --test overrides
          cargo test --locked -p taiyou-cli --test ass_coverage_batch
      - run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r build-support/requirements.txt
          python build-support/acquire.py
          python build-support/build-native.py
      - env:
          TAIYOU_TEST_FONT: ${{ runner.temp }}/taiyou-shaping-fonts/latin.otf
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
        run: cargo test --locked -p taiyou-cli --features native --test ass_coverage_batch
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/taiyou-libass-tests
          key: candidate-corpus-linux-a5073319af8117271d8ac13ef5c088197ff2d59b-v1
      - run: python validation/acquire.py
      - env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/taiyou-native-install/lib/pkgconfig
          PKG_CONFIG_ALL_STATIC: '1'
          LIBZ_SYS_STATIC: '1'
        run: |
          cargo build --locked -p xtask -p taiyou-cli --features taiyou-cli/native
          cargo run --locked -p xtask -- compare --suite focused --profile core-v1 --case regression/vsf-quirks-var/alpha-clipping-2040.png --case regression/vsf-quirks-var/alpha-clipping-2560.png --case regression/vsf-quirks-var/alpha-clipping-4960.png
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: T018-coverage-batch-${{ github.sha }}
          path: |
            ${{ runner.temp }}/batch-format.patch
            ${{ runner.temp }}/taiyou-comparison/
