[workspace]
members = [
    "crates/taiyou-types",
    "crates/taiyou-ass",
    "crates/taiyou-font",
    "crates/taiyou-render",
    "crates/taiyou-capi",
    "crates/taiyou-cli",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
publish = false
# Licensing remains an owner decision; no license grant is implied.

[workspace.dependencies]
taiyou-types = { path = "crates/taiyou-types" }
taiyou-ass = { path = "crates/taiyou-ass" }
taiyou-font = { path = "crates/taiyou-font" }
taiyou-render = { path = "crates/taiyou-render" }
taiyou-cli = { path = "crates/taiyou-cli" }
harfbuzz-sys = { version = "=0.8.0", default-features = false }
freetype-sys = { version = "=0.23.0", default-features = false }
unicode-bidi = "=0.3.18"
unicode-script = "=0.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"
